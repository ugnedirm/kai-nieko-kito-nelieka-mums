name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp,agent]"
      - run: ruff check .
      - run: mypy
      - run: pytest

  package:
    # The built package must work on its own (it once shipped without its schema files).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          THREADVAULT_DIR=/tmp/clean-vault /tmp/clean/bin/thread init
          THREADVAULT_DIR=/tmp/clean-vault /tmp/clean/bin/thread verify
      - name: The extension builds and zips
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd extension && npm test && npm run build
      - run: python tools/package_extension.py
