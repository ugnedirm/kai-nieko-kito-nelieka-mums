[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threadvault"
version = "0.0.1"
description = "Portable, verifiable AI conversation threads (handover + files) that any AI can pick up."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["rfc3339-validator>=0.1.4", "pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "types-jsonschema"]
mcp = ["mcp>=1.0"]
ui = ["streamlit>=1.35"]
agent = ["anthropic>=2.8"]
llm = ["litellm>=1.40", "tiktoken>=0.7"]
privacy = ["presidio-analyzer>=2.2"]

[project.scripts]
thread = "threadvault.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/threadvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
