[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threadvault"
version = "0.1.0"
description = "Portable, verifiable AI conversation threads (handover + files) that any AI can pick up."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "typer>=0.12",
  "cryptography>=42",
]

readme = "README.md"

[project.urls]
Homepage = "https://github.com/ugnedirm/kai-nieko-kito-nelieka-mums"
Issues = "https://github.com/ugnedirm/kai-nieko-kito-nelieka-mums/issues"

[project.optional-dependencies]
# What the installer uses: PDF cleaning, OS keychain signing, the Claude Desktop connector, token counts.
recommended = ["pypdf>=5", "keyring>=24", "mcp>=2.3", "tiktoken>=0.7"]
dev = ["rfc3339-validator>=0.1.4", "pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "types-jsonschema",
       "keyring>=24", "pypdf>=5", "tiktoken>=0.7"]
keychain = ["keyring>=24"]
sanitize = ["pypdf>=5"]
mcp = ["mcp>=2.3"]
ui = ["streamlit>=1.35"]
agent = ["anthropic>=2.8"]
llm = ["litellm>=1.40", "tiktoken>=0.7"]
privacy = ["presidio-analyzer>=2.2"]

[project.scripts]
thread = "threadvault.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/threadvault"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "threadvault/_schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
