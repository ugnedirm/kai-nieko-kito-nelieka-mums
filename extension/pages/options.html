<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>threadvault options</title><link rel="stylesheet" href="style.css"></head>
<body><h1>threadvault options</h1>
<p><small>Get the token with <code>thread token show</code>. It is stored in this browser profile only and sent only to 127.0.0.1.</small></p>
<p><label>Vault token <input id="token" type="password" autocomplete="off" size="50"></label></p>
<p><label>Vault service port <input id="port" type="number" min="1024" max="65535"></label></p>
<p><label>Checkpoint every <input id="every" type="number" min="1" max="500"> replies</label>
<select id="mode"><option value="remind">remind me</option><option value="fill">fill the handover request for me</option><option value="off">off</option></select></p>
<p><label><input id="full" type="checkbox"> Full mode: also offer to save the whole conversation (stored as unverified)</label></p>
<p><button id="save">Save</button> <span id="msg"></span></p>
<script src="../src/lib/constants.js"></script><script src="options.js"></script></body></html>
